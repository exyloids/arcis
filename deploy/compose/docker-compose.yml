services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arcis
      POSTGRES_USER: arcis
      POSTGRES_PASSWORD: arcis
    ports:
      - "5432:5432"
    volumes:
      - arcis-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcis -d arcis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - arcis-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arcis-local
      MINIO_ROOT_PASSWORD: change-me-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - arcis-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://minio:9000 arcis-local change-me-local
      && mc mb --ignore-existing local/arcis-local"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      ARCIS_DATABASE_URL: postgresql+psycopg://arcis:arcis@postgres:5432/arcis
      ARCIS_REDIS_URL: redis://redis:6379/0
      ARCIS_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      ARCIS_OBJECT_STORAGE_BUCKET: arcis-local
      ARCIS_OBJECT_STORAGE_ACCESS_KEY: arcis-local
      ARCIS_OBJECT_STORAGE_SECRET_KEY: change-me-local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  arcis-postgres:
  arcis-redis:
  arcis-minio:
